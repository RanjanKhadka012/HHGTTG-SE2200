<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Remember To Do</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="login.js" defer></script>
</head>

<body>
    <div class="wrap">
        <h1 class="title">Login</h1>

        <form id="login-form" class="event-form" aria-hidden="false">
            <label>Username
                <input type="text" name="username" required>
            </label>

            <label>Password
                <input type="password" name="password" required>
            </label>

            <div class="form-actions">
                <button type="submit" class="btn">Login</button>
                <a class="btn muted" href="signup.html">Sign Up</a>
            </div>
        </form>
    </div>
</body>
</html>
