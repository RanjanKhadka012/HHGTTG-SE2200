<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Remember To Do</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="signup.js" defer></script>
</head>

<body>
    <div class="wrap">
        <h1 class="title">Sign Up</h1>

        <form id="signup-form" class="event-form" aria-hidden="false">
            <label>Name
                <input type="text" name="name" required>
            </label>

            <label>Email
                <input type="email" name="email" required>
            </label>

            <label>Username
                <input type="text" name="username" required>
            </label>

            <label>Password
                <input type="password" name="password" required>
            </label>

            <div class="form-actions">
                <button type="submit" class="btn">Create Account</button>
                <a class="btn muted" href="login.html">Login</a>
            </div>
        </form>
    </div>
</body>
</html>
